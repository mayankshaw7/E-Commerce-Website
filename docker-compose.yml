version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: shopping-app-mongo
    ports:
      - "27017:27017"

  # Shopping App
  shopping-app:
    build: .
    container_name: shopping-app
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017/E-Com
      PORT: 3000
    ports:
      - "3000:3000"